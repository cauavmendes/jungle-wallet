services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 5s
      timeout: 3s
      retries: 10

  ministack:
    image: ministackorg/ministack:1.5.27
    ports:
      - '4566:4566'

volumes:
  postgres-data:
